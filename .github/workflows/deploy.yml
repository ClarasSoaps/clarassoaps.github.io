name: Deploy site

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one finish rather than
# cancelling it midway through a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Checkout credentials. Add these under
          # Settings → Secrets and variables → Actions → Variables.
          # Missing values are fine: PayPal shows a "not configured" notice
          # and no order emails are sent.
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ vars.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          NEXT_PUBLIC_VENMO_USERNAME: ${{ vars.NEXT_PUBLIC_VENMO_USERNAME }}
          NEXT_PUBLIC_ZELLE_CONTACT: ${{ vars.NEXT_PUBLIC_ZELLE_CONTACT }}
          NEXT_PUBLIC_CLARA_EMAIL: ${{ vars.NEXT_PUBLIC_CLARA_EMAIL }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_CUSTOMER_TEMPLATE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_CUSTOMER_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_CLARA_TEMPLATE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_CLARA_TEMPLATE_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
