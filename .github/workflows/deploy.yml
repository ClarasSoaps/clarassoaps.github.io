name: Build and publish site

# GitHub Pages here serves plain files from main's root, and changing that
# source needs repo-admin access we don't have. So this workflow builds the
# static export and commits the result back into the root, where Pages will
# pick it up. Source lives in app/, components/, lib/, public/ as usual.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Checkout credentials, set under
          # Settings → Secrets and variables → Actions → Variables.
          # Leaving them unset is safe: PayPal shows a "not configured"
          # notice and no order emails are sent.
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ vars.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          NEXT_PUBLIC_VENMO_USERNAME: ${{ vars.NEXT_PUBLIC_VENMO_USERNAME }}
          NEXT_PUBLIC_ZELLE_CONTACT: ${{ vars.NEXT_PUBLIC_ZELLE_CONTACT }}
          NEXT_PUBLIC_CLARA_EMAIL: ${{ vars.NEXT_PUBLIC_CLARA_EMAIL }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_CUSTOMER_TEMPLATE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_CUSTOMER_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_CLARA_TEMPLATE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_CLARA_TEMPLATE_ID }}

      - name: Copy build output into the repo root
        # Copies only; never deletes, so app/ and friends are untouched.
        run: rsync -a --exclude='.git' out/ ./

      - name: Commit the published site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged — nothing to publish."
            exit 0
          fi
          # [skip ci] belt-and-braces; pushes made with GITHUB_TOKEN do not
          # retrigger workflows anyway.
          git commit -m "Publish site build [skip ci]"
          git push
